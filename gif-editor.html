<main>

<div class="page">
<h1 data-i18n="tool_gifedit">GIF Editor</h1>
<p class="desc" data-i18n="tool_gifedit_desc">Resize, speed up, slow down or thin frames of a GIF.</p>
<div class="tool-old">
<div class="tool-left"><div class="tool-module"><h2 data-i18n="mod_upload">mod_upload</h2><label class="upload-zone" id="uploadZone" for="gifInput">
  <div class="big" data-i18n="up_drop">%s</div>
  <div class="hint" data-i18n="up_gif">%s</div>
  <div class="hint" id="fileNameHint" style="margin-top:8px;color:var(--blue);font-weight:600;"></div>
  <input type="file" id="gifInput" accept="image/gif,.gif">
</label></div><div class="tool-module"><h2 data-i18n="mod_edit">mod_edit</h2><div class="params"><div class="field"><label data-i18n="out_width">out_width</label>
<input type="number" id="outWidth" value="480" min="64" max="800" step="1"></div><div class="field"><label data-i18n="every_n">every_n</label>
<input type="number" id="everyN" value="1" min="1" max="10" step="1"></div><div class="field"><label data-i18n="speed">speed</label>
<input type="number" id="speedFactor" value="1" min="0.1" max="4" step="0.1"></div><div class="field"><label data-i18n="crop_pct_short">crop_pct_short</label>
<input type="number" id="cropPct" value="100" min="10" max="100" step="1"></div><div class="field"><label data-i18n="rotate">Rotate</label><select id="rotate"><option value="0" data-i18n="rot_0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></div><div class="field check"><input type="checkbox" id="flipH"><label data-i18n="flip_h">flip_h</label></div><div class="field check"><input type="checkbox" id="flipV"><label data-i18n="flip_v">flip_v</label></div><div class="field check"><input type="checkbox" id="reverse"><label data-i18n="reverse">Reverse animation</label></div><div class="field check"><input type="checkbox" id="lightMode"><label data-i18n="lightweight">lightweight</label></div></div></div><div class="actions">
<button class="btn" id="convertBtn" data-i18n="convert_btn">Convert</button>
<button class="btn ghost" id="cancelBtn" style="display:none" data-i18n="cancel_btn">Cancel</button>
</div><div class="progress-wrap" id="progressWrap" style="display:none">
<div class="progress-head"><span class="progress-stage" id="progressStage" data-i18n="converting">Converting…</span><span class="progress-pct" id="progressPct">0%</span></div>
<div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
</div><div class="error-card" id="errorCard" style="display:none">
<h4 data-i18n="error_title">Conversion failed</h4>
<p id="errorMsg"></p>
<button class="btn danger" id="retryBtn" style="margin-top:10px" data-i18n="retry">Retry</button>
</div><div class="warn-card" id="warnCard" style="display:none">
<p id="warnMsg"></p>
<div class="actions" style="margin-top:10px">
<button class="btn" id="warnYes" data-i18n="warn_yes">Lower settings</button>
<button class="btn ghost" id="warnNo" data-i18n="warn_no">Keep going</button>
</div>
</div></div>
<div class="tool-right"><h3 class="result-title" data-i18n="result_title">Output Result</h3><div class="preview-placeholder" data-i18n="preview_placeholder">Preview</div><img id="sourcePreview" class="source-preview" style="display:none" alt=""><div class="result" id="resultWrap">
<div class="result-card">
<div class="file-name" id="fileName"></div>
<div class="file-size" id="fileSize"></div>
<a class="btn" id="downloadBtn" data-i18n="download" style="margin-top:12px;display:inline-block;">Download</a>
<img class="preview" id="previewImg" style="display:none;" alt="result">
</div>
</div></div>
