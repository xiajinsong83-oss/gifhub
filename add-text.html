<body data-page="add-text" data-seo="text">
<main>

<div class="page">
<h1 data-i18n="tool_text">Add Text</h1>
<p class="desc" data-i18n="tool_text_desc">Add captions and watermarks to images and GIFs.</p>
<div class="panel"><h2 data-i18n="params">params</h2><div class="upload-zone" id="uploadZone">
  <div class="big" data-i18n="up_drop">%s</div>
  <div class="hint" data-i18n="up_images">%s</div>
  <div class="hint" id="fileNameHint" style="margin-top:8px;color:var(--pine);font-weight:600;"></div>
  <input type="file" id="srcInput" accept="image/*">
</div><div class="params"><div class="field"><label data-i18n="text_content">Text</label><input type="text" id="textContent" value="Hello"></div><div class="field"><label data-i18n="text_size">text_size</label>
<input type="number" id="textSize" value="48" min="8" max="300" step="1"></div><div class="field"><label data-i18n="text_color">Color</label><input type="color" id="textColor" value="#ffffff"></div><div class="field"><label data-i18n="text_pos">Position</label><select id="textPos"><option value="center">Center</option><option value="top">Top</option><option value="bottom" selected>Bottom</option></select></div><div class="field"><label data-i18n="to">To format</label><select id="toFormat"><option value="gif">GIF</option><option value="apng">APNG</option><option value="png">PNG</option><option value="webp">WebP</option><option value="jpg">JPG</option></select></div></div><div class="actions">
<button class="btn" id="convertBtn" data-i18n="convert_btn">Convert</button>
<button class="btn ghost" id="cancelBtn" style="display:none" data-i18n="cancel_btn">Cancel</button>
</div><div class="progress-wrap" id="progressWrap">
<div class="progress-stage" id="progressStage" data-i18n="converting">Converting…</div>
<div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
</div><div class="result" id="resultWrap">
<div class="result-card">
<div class="file-name" id="fileName"></div>
<div class="file-size" id="fileSize"></div>
<a class="btn" id="downloadBtn" data-i18n="download" style="margin-top:12px;display:inline-block;">Download</a>
<img class="preview" id="previewImg" style="display:none;" alt="result">
</div>
</div><div class="error-card" id="errorCard">
<h4 data-i18n="error_title">Conversion failed</h4>
<p id="errorMsg"></p>
<button class="btn danger" id="retryBtn" style="margin-top:10px" data-i18n="retry">Retry</button>
</div><div class="warn-card" id="warnCard">
<p id="warnMsg"></p>
<div class="actions" style="margin-top:10px">
<button class="btn" id="warnYes" data-i18n="warn_yes">Lower settings</button>
<button class="btn ghost" id="warnNo" data-i18n="warn_no">Keep going</button>
</div>
