<div class="ad-slot" aria-label="Advertisement"></div>
<main>

<div class="page">
<h1 data-i18n="tool_image">Image Processor</h1>
<p class="desc" data-i18n="tool_image_desc">Resize images and convert between PNG, JPG, WebP and GIF.</p>
<div class="tool-layout">
  <div class="tool-pane upload-pane"><label class="upload-zone" id="uploadZone" for="imgInput">
  <div class="big" data-i18n="up_drop">%s</div>
  <div class="hint" data-i18n="up_images">%s</div>
  <div class="hint" id="fileNameHint" style="margin-top:8px;color:var(--blue);font-weight:600;"></div>
  <input type="file" id="imgInput" accept="image/*">
</label></div>
  <div class="tool-pane preview-pane"><div class="preview-placeholder" data-i18n="preview_placeholder">Preview</div><img id="sourcePreview" class="source-preview" style="display:none" alt=""></div>
</div>
<div class="tool-pane bottom-pane"><div class="params"><div class="field"><label data-i18n="out_width">out_width</label>
<input type="number" id="outWidth" value="1024" min="64" max="4096" step="1"></div><div class="field"><label data-i18n="crop_pct">crop_pct</label>
<input type="number" id="cropPct" value="100" min="10" max="100" step="1"></div><div class="field"><label data-i18n="img_quality">img_quality</label><select id="imgQuality"><option value="high" data-i18n="quality_hi">High</option><option value="med" selected data-i18n="quality_med">Medium</option><option value="low" data-i18n="quality_low">Low</option></select></div><div class="field"><label data-i18n="to">To format</label><select id="toFormat"><option value="png">PNG</option><option value="jpg">JPG</option><option value="webp">WebP</option><option value="gif">GIF</option></select></div></div><div class="actions">
<button class="btn" id="convertBtn" data-i18n="convert_btn">Convert</button>
<button class="btn ghost" id="cancelBtn" style="display:none" data-i18n="cancel_btn">Cancel</button>
</div><div class="progress-wrap" id="progressWrap">
<div class="progress-stage" id="progressStage" data-i18n="converting">Converting…</div>
<div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
</div><div class="result" id="resultWrap">
<div class="result-card">
<div class="file-name" id="fileName"></div>
<div class="file-size" id="fileSize"></div>
<a class="btn" id="downloadBtn" data-i18n="download" style="margin-top:12px;display:inline-block;">Download</a>
<img class="preview" id="previewImg" style="display:none;" alt="result">
</div>
</div><div class="error-card" id="errorCard">
<h4 data-i18n="error_title">Conversion failed</h4>
<p id="errorMsg"></p>
<button class="btn danger" id="retryBtn" style="margin-top:10px" data-i18n="retry">Retry</button>
</div><div class="warn-card" id="warnCard">
<p id="warnMsg"></p>
<div class="actions" style="margin-top:10px">
<button class="btn" id="warnYes" data-i18n="warn_yes">Lower settings</button>
<button class="btn ghost" id="warnNo" data-i18n="warn_no">Keep going</button>
</div>
